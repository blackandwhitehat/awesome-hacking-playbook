name: Generate MANIFEST.json

on:
  push:
    branches: [main]
    paths:
      - '*/**.md'
      - '!README.md'
      - '!CONTRIBUTING.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generated-manifests
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate MANIFEST.json for each playbook
        run: python3 .github/scripts/generate_manifests.py

      - name: Open or update generated-manifest pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          automation_branch=automation/generated-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*/MANIFEST.json'
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-generate MANIFEST.json files"
          git fetch origin "${automation_branch}:refs/remotes/origin/${automation_branch}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${automation_branch}"

          if gh pr view "${automation_branch}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${automation_branch}" --repo "${GITHUB_REPOSITORY}" \
              --title "Auto-generate MANIFEST.json files" \
              --body "Generated by the manifest workflow. Refs #3."
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${automation_branch}" \
              --title "Auto-generate MANIFEST.json files" \
              --body "Generated by the manifest workflow. Refs #3."
          fi
